version: "3.9"

# ============================================================================
# ECOPYE — Production stack (Hostinger VPS)
# ============================================================================
# Usage: docker compose -f infrastructure/docker/docker-compose.prod.yml up -d
#
# Lit les secrets depuis /opt/ecopye/ECOPYE-AP/.env (monté par PM2/systemd)
# Postgres + Redis tournent en conteneurs, l'API et le Web tournent via PM2
# sur l'hôte pour profiter de zero-downtime reload + logs unifiés.
# ============================================================================

name: ecopye-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecopye-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecopye}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-ecopye}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecopye} -d ${POSTGRES_DB:-ecopye}"]
      interval: 10s
      timeout: 3s
      retries: 10
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "effective_cache_size=2GB"
      - "-c"
      - "work_mem=32MB"
      - "-c"
      - "log_min_duration_statement=500"
      - "-c"
      - "ssl=off"

  redis:
    image: redis:7-alpine
    container_name: ecopye-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--maxmemory"
      - "1gb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--requirepass"
      - "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
    name: ecopye_prod_postgres_data
  redis_data:
    name: ecopye_prod_redis_data
